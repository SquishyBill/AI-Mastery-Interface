<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Threat Scanner: a 15-minute activity that teaches teachers and students to evaluate the privacy and security of AI tools.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z' fill='%2305101e' stroke='%2322d3ff' stroke-width='1.8'/%3E%3C/svg%3E">
<title>Threat Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one terminal-style column over falling code; a sticky step bar; panels swap in place. Single deliberate dark look. */
:root {
  --bg: #050c18;
  --panel: rgba(8, 18, 36, 0.88);
  --panel-solid: #0a1528;
  --line: #1a3a63;
  --accent: #22d3ff;
  --accent-dim: #1389ad;
  --ok: #2be08a;
  --ok-dim: #17995f;
  --text: #d6e5f8;
  --muted: #8ba7c7;
  --red: #ff4d5e;
  --blue: #4aa8ff;
  --amber: #ffcf40;
  --lens-data: #35f0c8;
  --lens-rules: #8fb8ff;
  --lens-sight: #d58bff;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 17px/1.6 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 64px;
  min-height: 100vh;
}
#rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .9; pointer-events: none; }
.shell { position: relative; z-index: 1; max-width: 880px; margin-inline: auto; }

header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: rgba(5, 12, 24, .94); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding: 10px 16px 0;
}
.bar-inner { max-width: 880px; margin-inline: auto; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font: 700 24px/1 var(--font-display); letter-spacing: .14em; margin: 0; color: var(--accent); text-shadow: 0 0 10px rgba(34,211,255,.55); }
.brand span { color: var(--muted); font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
nav.steps { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
nav.steps::-webkit-scrollbar { display: none; }
nav.steps button {
  flex: 1 0 auto; background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent;
  font: 500 13px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 10px 12px; cursor: pointer; white-space: nowrap;
}
nav.steps button small { display: block; font-size: 10px; opacity: .7; letter-spacing: .04em; text-transform: none; margin-top: 2px; }
nav.steps button:hover { color: var(--accent); }
nav.steps button[aria-current="step"] { color: var(--accent); border-bottom-color: var(--accent); text-shadow: 0 0 8px rgba(34,211,255,.5); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-top: 24px; display: grid; gap: 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 22px; box-shadow: 0 0 24px rgba(34,211,255,.06); min-width: 0; }
.panel h2 { font: 700 30px/1.1 var(--font-display); margin: 0 0 8px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; text-wrap: balance; }
.panel h3 { font: 600 13px/1.4 var(--font-body); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; color: var(--accent-dim); }
.panel p { margin: 0 0 12px; max-width: 68ch; }
.prompt::before { content: "> "; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }
.stack { display: grid; gap: 14px; }

.btn {
  font: 600 15.5px/1.2 var(--font-body); letter-spacing: .04em; cursor: pointer; padding: 13px 18px; min-height: 48px;
  background: transparent; color: var(--accent); border: 1px solid var(--accent-dim);
}
.btn:hover { background: rgba(34,211,255,.1); border-color: var(--accent); }
.btn.solid { background: var(--accent); color: #001a24; border-color: var(--accent); }
.btn.solid:hover { background: #7be4ff; }
.btn.red { color: var(--red); border-color: var(--red); }
.btn.red:hover { background: rgba(255,51,71,.12); }
.btn.blue { color: var(--blue); border-color: var(--blue); }
.btn.blue:hover { background: rgba(74,168,255,.12); }
.btn[disabled] { opacity: .35; cursor: default; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* role choice */
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.role { text-align: left; padding: 16px; background: var(--panel-solid); border: 1px solid var(--line); color: var(--text); cursor: pointer; font: inherit; }
.role strong { display: block; font: 700 19px/1.1 var(--font-display); text-transform: uppercase; color: var(--accent); margin-bottom: 4px; letter-spacing: .05em; }
.role:hover, .role[aria-pressed="true"] { border-color: var(--accent); background: rgba(34,211,255,.07); }
.role[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--accent); }

/* lens key */
.lenses { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.lens { border: 1px solid var(--line); padding: 12px; background: var(--panel-solid); border-top: 3px solid var(--c); min-width: 0; }
.lens b { display: block; color: var(--c); font: 700 20px/1.1 var(--font-display); letter-spacing: .12em; }
.lens span { font-size: 13px; color: var(--text); }

/* clauses */
.clause { border: 1px solid var(--line); background: var(--panel-solid); padding: 16px; display: grid; gap: 12px; }
.clause.done.ok, .clause.done.caught { border-color: var(--ok-dim); }
.clause.done.false, .clause.done.miss { border-color: var(--red); }
.clause.done.lens { border-color: var(--amber); }
.clause-head { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
blockquote { margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--accent-dim); font-size: 17px; }
.lens-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 600 15px/1 var(--font-body); padding: 11px 14px; min-height: 44px; background: transparent; cursor: pointer; border: 1px solid var(--c); color: var(--c); letter-spacing: .08em; }
.chip:hover { background: rgba(255,255,255,.07); }
.feedback { font-size: 16px; padding: 10px 12px; border-left: 3px solid var(--fc, var(--accent)); background: rgba(255,255,255,.03); }
.feedback strong { color: var(--fc, var(--accent)); letter-spacing: .06em; text-transform: uppercase; font-size: 12px; display: block; margin-bottom: 2px; }
.tag { display: inline-block; padding: 1px 8px; font-size: 12.5px; letter-spacing: .1em; border: 1px solid var(--c); color: var(--c); margin-right: 6px; }

.meter { height: 8px; background: #10264a; border: 1px solid var(--line); }
.meter > i { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 8px rgba(34,211,255,.7); transition: width .3s; }
.progress { display: grid; gap: 4px; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

.scorebox { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); padding: 10px 12px; background: var(--panel-solid); }
.stat b { display: block; font: 700 32px/1.1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat.warn b { color: var(--red); }

/* silence */
.sil { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; padding: 12px 0; border-top: 1px dashed var(--line); align-items: center; }
.sil:first-of-type { border-top: 0; }
.sil .fb { grid-column: 1 / -1; }
@media (max-width: 560px) { .sil { grid-template-columns: 1fr; } }

/* checklist */
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
input[type=text], textarea, select {
  width: 100%; background: #08132a; color: var(--accent); border: 1px solid var(--accent-dim); padding: 11px 12px;
  font: 400 15px/1.4 var(--font-body); border-radius: 0; caret-color: var(--accent);
}
input::placeholder, textarea::placeholder { color: #4f6f94; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.q { border: 1px solid var(--line); background: var(--panel-solid); border-left: 3px solid var(--c); padding: 14px; display: grid; gap: 10px; }
.q .qt { font-weight: 500; }
.q .hint { font-size: 14.5px; color: var(--muted); }
.q .stop { color: var(--red); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
.opt { font: 500 16px/1.3 var(--font-body); padding: 12px 8px; min-height: 48px; background: transparent; color: var(--text); border: 1px solid var(--line); cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"][data-v="0"] { border-color: var(--ok); color: var(--ok); background: rgba(43,224,138,.1); }
.opt[aria-pressed="true"][data-v="1"] { border-color: var(--amber); color: var(--amber); background: rgba(255,207,64,.1); }
.opt[aria-pressed="true"][data-v="2"] { border-color: var(--red); color: var(--red); background: rgba(255,51,71,.1); }

/* trust card */
.card { border: 2px solid var(--vc); background: var(--panel-solid); padding: 20px; display: grid; gap: 16px; box-shadow: 0 0 28px color-mix(in srgb, var(--vc) 25%, transparent); }
.card-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.card-top .kv { font-size: 13px; color: var(--muted); }
.card-top .kv b { color: var(--text); font-weight: 500; }
.verdict { font: 700 52px/1 var(--font-display); color: var(--vc); letter-spacing: .05em; text-shadow: 0 0 14px color-mix(in srgb, var(--vc) 60%, transparent); }
.verdict small { display: block; font: 500 13px/1.4 var(--font-body); letter-spacing: .04em; color: var(--text); text-shadow: none; margin-top: 8px; max-width: 60ch; }
.lensbars { display: grid; gap: 10px; }
.lb { display: grid; grid-template-columns: 70px 1fr 120px; gap: 10px; align-items: center; font-size: 13px; }
.lb b { color: var(--c); font: 700 17px/1 var(--font-display); letter-spacing: .12em; }
.lb .meter > i { background: var(--c); box-shadow: none; }
@media (max-width: 560px) { .lb { grid-template-columns: 56px 1fr; } .lb .st { grid-column: 1 / -1; } }
.stops { border: 1px solid var(--red); background: rgba(255,51,71,.08); padding: 10px 12px; font-size: 14px; }
.stops ul { margin: 6px 0 0; padding-left: 18px; }

/* guide */
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tablewrap { overflow-x: auto; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--accent-dim); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
details { border: 1px solid var(--line); background: var(--panel-solid); padding: 12px 14px; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
details[open] summary { margin-bottom: 8px; }
.policybox { border: 1px solid var(--accent-dim); background: #08132a; padding: 14px 16px; display: grid; gap: 6px; }
.policybox p { margin: 0; font-size: 14px; }
.policy-title { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-dim); }
.found { border: 1px solid var(--accent-dim); background: #08132a; padding: 14px; display: grid; gap: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.links a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.links a:hover { color: #9fd0ff; }
.chipbtn { font: 500 12px/1 var(--font-body); padding: 9px 12px; min-height: 36px; background: transparent; color: var(--accent); border: 1px solid var(--accent-dim); cursor: pointer; margin: 2px 4px 2px 0; }
.chipbtn:hover { border-color: var(--accent); background: rgba(34,211,255,.1); }
.autonote { font-size: 13px; color: var(--amber); border-left: 3px solid var(--amber); padding: 6px 10px; background: rgba(255,207,64,.06); }
.chipbtn.big { padding: 11px 14px; min-height: 44px; font-size: 13px; }
.chipbtn[aria-pressed="true"] { border-color: var(--accent); background: rgba(34,211,255,.14); color: var(--accent); }
ol.terms { margin: 0; padding-left: 24px; display: grid; gap: 8px; font-size: 14px; }
ol.terms li::marker { color: var(--accent-dim); }
ul.tight { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.copyblock { white-space: pre-wrap; background: #08132a; border: 1px solid var(--line); padding: 14px; font-size: 13px; color: var(--text); overflow-x: auto; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent); color: #001a24; padding: 10px 16px; font-weight: 600; z-index: 20; }
.cursor::after { content: "_"; animation: blink 1s steps(1) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } .meter > i { transition: none; } }
@media (max-width: 560px) { .panel { padding: 16px; } .panel h2 { font-size: 25px; } .verdict { font-size: 40px; } }

/* HUD details */
nav.steps button, .tag, .field label, .progress, .stat span, .clause-head, .policy-title, th, .chip, .stop, .kv, .btn, .opt, .chipbtn, .sil .btn { font-family: var(--font-mono); }
.btn, .opt, .chip, .chipbtn { letter-spacing: .02em; }
.panel { position: relative; }
.panel::before, .panel::after { content: ""; position: absolute; width: 16px; height: 16px; pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
.panel h3 { font-family: var(--font-mono); }
blockquote { font-family: var(--font-body); }

/* Premium layer: glass, glow, gauges, rings, badges, motion */
.panel { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: box-shadow .25s, border-color .25s; }
.panel:hover { border-color: #24508a; box-shadow: 0 0 30px rgba(34,211,255,.12); }
.btn { transition: background .2s, box-shadow .2s, border-color .2s, transform .1s; }
.btn:hover { box-shadow: 0 0 14px rgba(34,211,255,.35); }
.btn:active { transform: translateY(1px); }
.btn.solid { position: relative; overflow: hidden; box-shadow: 0 0 16px rgba(34,211,255,.35); }
.btn.solid::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); transform: translateX(-120%); animation: shimmer 3.4s ease-in-out infinite; pointer-events: none; }
@keyframes shimmer { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.ico { flex: none; }
.lens b { display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; }
.tag { display: inline-flex; align-items: center; gap: 5px; }

.clause { position: relative; overflow: hidden; transition: border-color .25s, box-shadow .25s; }
.clause:hover { box-shadow: 0 0 20px rgba(34,211,255,.12); }
.clause.fresh::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; background: linear-gradient(90deg, transparent, rgba(34,211,255,.38), transparent); animation: beam .8s ease-out forwards; pointer-events: none; }
@keyframes beam { to { left: 110%; } }
.stamp { font: 600 11px/1 var(--font-mono); letter-spacing: .12em; padding: 5px 8px; border: 1.5px solid var(--sc); color: var(--sc); transform: rotate(-3deg); text-transform: uppercase; white-space: nowrap; }
.clause.fresh .stamp { animation: stampin .45s cubic-bezier(.2,1.4,.4,1) .25s both; }
@keyframes stampin { from { opacity: 0; transform: scale(1.8) rotate(-12deg); } to { opacity: 1; transform: scale(1) rotate(-3deg); } }

.gauges { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end; }
.gauge { width: 170px; text-align: center; }
.gauge svg { width: 100%; height: auto; display: block; }
.trackp { fill: none; stroke: #10264a; stroke-width: 11; stroke-linecap: round; }
.arcp { fill: none; stroke: var(--gc); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1); filter: drop-shadow(0 0 5px var(--gc)); }
.gval { font: 700 26px/1 var(--font-display); fill: var(--text); }
.gcap { font: 500 11px/1.2 var(--font-mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-top: -4px; }

.trk { height: 3px; background: #10264a; margin-inline: -16px; }
.trk i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); box-shadow: 0 0 8px var(--accent); transition: width .5s ease; }
nav.steps button.done small::after { content: " \2713"; color: var(--ok); }

.card { position: relative; }
.card::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); pointer-events: none; }
.cardhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font: 600 11px/1 var(--font-mono); letter-spacing: .16em; color: var(--muted); }
.cid { display: flex; align-items: center; gap: 10px; color: var(--text); }
.cid svg { display: block; height: 22px; width: auto; }
.rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.ring { text-align: center; }
.ring svg { width: 96px; height: 96px; display: block; margin: 0 auto; }
.rtrack { fill: none; stroke: #10264a; stroke-width: 7; }
.rarc { fill: none; stroke: var(--gc); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1); filter: drop-shadow(0 0 4px var(--gc)); }
.rname { font: 700 15px/1 var(--font-display); letter-spacing: .12em; color: var(--c); margin-top: 4px; }
.rst { font: 500 12px/1.4 var(--font-mono); letter-spacing: .06em; }
.card.anim { animation: printin 1s ease-out both; }
@keyframes printin { from { clip-path: inset(0 0 100% 0); opacity: .2; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.card.anim .verdict { animation: verdictin .6s cubic-bezier(.2,1.4,.4,1) .8s both; transform-origin: left center; }
@keyframes verdictin { from { opacity: 0; transform: scale(1.35) rotate(-2deg); } to { opacity: 1; transform: none; } }

.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.badge { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); padding: 10px 12px; background: var(--panel-solid); opacity: .5; filter: grayscale(.6); transition: opacity .3s; }
.badge.on { opacity: 1; filter: none; border-color: var(--ok-dim); box-shadow: 0 0 16px rgba(43,224,138,.18); }
.bico { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; color: var(--muted); }
.badge.on .bico { color: var(--ok); }
.badge b { display: block; font: 700 14px/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.badge small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }

.swap > * { animation: rise .45s ease-out both; }
.swap > *:nth-child(2) { animation-delay: .06s; }
.swap > *:nth-child(3) { animation-delay: .12s; }
.swap > *:nth-child(4) { animation-delay: .18s; }
.swap > *:nth-child(n+5) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.bootscreen { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; place-content: center; padding: 24px; animation: bootout .5s ease 6s forwards; }
.bootscreen.out { opacity: 0; visibility: hidden; transition: opacity .5s, visibility 0s .5s; }
@keyframes bootout { to { opacity: 0; visibility: hidden; } }
.bootlog { font: 500 14px/1.9 var(--font-mono); color: var(--accent); max-width: 600px; }
.bootlog .t { color: var(--text); }
.bootlog .ok { color: var(--ok); }
.bootskip { margin-top: 18px; font: 500 11px/1 var(--font-mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) {
  .btn.solid::after, .clause.fresh::after { display: none; }
  .stamp, .card.anim, .card.anim .verdict, .swap > * { animation: none !important; }
  .arcp, .rarc, .trk i { transition: none; }
  .bootscreen { display: none; }
}

      '<section class="panel stack"><div class="field"><label for="ask">One question I would ask the company before using it</label><textarea id="ask" rows="3" placeholder="Example: Can you confirm in writing that student work is never used to train your models?">' + esc(S.ask) + '</textarea></div>' +
      '<div class="row"><button class="btn solid big" data-act="go" data-step="card">Generate Clearance Card &rarr;</button></div></section>';
  }

  function riskGauges(r) {
    var full = r.answered === CHECK.length, stopped = r.stops.length > 0, pct = Math.max(r.total / 18, stopped ? .7 : 0);
    var col = stopped || r.total >= 10 ? 'var(--red)' : r.total >= 5 ? 'var(--amber)' : (r.answered ? 'var(--ok)' : 'var(--accent)');
    var cap = stopped ? 'Hard stop found' : full ? 'Verdict: ' + VERDICT[r.v].label : 'Risk so far';
    return '<div class="gauges">' + gaugeHTML('answered', r.answered / CHECK.length, r.answered + '/' + CHECK.length, 'Questions answered', 'var(--accent)') + gaugeHTML('risk', pct, r.answered ? String(r.total) : '--', cap, col) + '</div>';
  }

  var RANKS = [
    { min: 0.85, name: 'ELITE', n: 4, color: 'var(--ok)' },
    { min: 0.65, name: 'SPECIALIST', n: 3, color: 'var(--accent)' },
    { min: 0.40, name: 'ANALYST', n: 2, color: 'var(--amber)' },
    { min: 0, name: 'RECRUIT', n: 1, color: 'var(--muted)' }
  ];
  function rankFor(v) { for (var i = 0; i < RANKS.length; i++) if (v >= RANKS[i].min - 1e-9) return RANKS[i]; return RANKS[RANKS.length - 1]; }

  function partAttempts() {
    var arr = S.history.map(function (h) { return { name: h.name, tier: h.tier, a: h.a, b: h.b, ta: h.ta, sb: h.sb }; });
    var p = prod(), t = tally();
    if (!S.logged[S.attempt]) {
      var cur = { name: p.name, tier: S.tier, a: null, b: null, ta: null, sb: null };
      if (t.done === p.clauses.length) { cur.a = (t.caught + t.ok + 0.5 * t.lens) / p.clauses.length; cur.ta = { caught: t.caught, flags: t.flags, lens: t.lens, miss: t.miss, falseAlarm: t.falseAlarm }; }
      if (Object.keys(S.sil).length === p.silence.length) {
        var sOk = p.silence.filter(function (q, k) { return S.sil[k] && (S.sil[k] === 'ans') === q.ans; }).length;
        cur.b = sOk / p.silence.length; cur.sb = { ok: sOk, tot: p.silence.length };
      }
      if (cur.a !== null || cur.b !== null) arr.push(cur);
    }
    return arr;
  }
  function partBest(kind) {
    var arr = partAttempts().filter(function (x) { return x[kind] !== null && x[kind] !== undefined; });
    if (!arr.length) return null;
    var best = arr[0]; arr.forEach(function (x) { if (x[kind] >= best[kind]) best = x; });
    return { val: best[kind], name: best.name, tier: best.tier, ta: best.ta, sb: best.sb, count: arr.length };
  }
  function partBox(label, best, kind) {
    if (!best) return '<div class="pbox none"><div class="plab">' + label + '</div><div class="small muted">Not completed yet.</div></div>';
    var rk = rankFor(best.val), bar = '';
    for (var i = 1; i <= 4; i++) bar += '<i' + (i <= rk.n ? ' class="on"' : '') + '></i>';
    var detail = kind === 'a' && best.ta
      ? 'Caught ' + best.ta.caught + ' of ' + best.ta.flags + ' flags. ' + best.ta.lens + ' on the wrong lens, ' + best.ta.miss + ' missed, ' + best.ta.falseAlarm + ' false alarm' + (best.ta.falseAlarm === 1 ? '' : 's') + '.'
      : best.sb ? 'Got ' + best.sb.ok + ' of ' + best.sb.tot + ' right.' : '';
    return '<div class="pbox" style="--rc:' + rk.color + '"><div class="plab">' + label + '</div><div class="prank">' + rk.name + '</div><div class="ranklvl" aria-hidden="true">' + bar + '</div>' +
      '<div class="pscore">' + Math.round(best.val * 100) + '%</div><div class="small muted">' + detail + '</div>' +
      '<div class="small muted">' + esc(best.name) + ' &middot; ' + TIERNAME[best.tier - 1] + (best.count > 1 ? ' &middot; best of ' + best.count : '') + '</div></div>';
  }
  function partsHTML() {
    return '<div class="parts">' + partBox('Part A &middot; Spotting risks', partBest('a'), 'a') + partBox('Part B &middot; What is missing', partBest('b'), 'b') + '</div>' +
      '<div class="small muted ranknote">Ranks: Recruit under 40%, Analyst 40 to 64%, Specialist 65 to 84%, Elite 85% and up. Each uses your best scenario.</div>';
  }

  function cardText() {
    var r = risk(), V = VERDICT[r.v], d = new Date().toLocaleDateString(), pa = partBest('a'), pb = partBest('b');
    function pl(label, b) { return b ? label + ': ' + rankFor(b.val).name + ' ' + Math.round(b.val * 100) + '% (' + b.name + ', ' + TIERNAME[b.tier - 1] + ')' : label + ': not completed'; }
    var lines = ['CLEARANCE CARD', 'Checked by: ' + roleLabel() + (S.dist ? ', ' + S.dist : ''), 'Date: ' + d, '', pl('PART A, spotting risks', pa), pl('PART B, what is missing', pb), '', 'FIELD TEST', 'Tool: ' + (S.tool || '(not named)')];
    if (S.pol) lines.push('District policy checked: ' + S.pol);
    lines.push('VERDICT: ' + V.label, 'Next step: ' + V.next, '');
    Object.keys(LENS).forEach(function (k) { lines.push(LENS[k].name + ': ' + lensStatus(r.per[k]) + ' (' + r.per[k] + '/6 risk)'); });
    if (r.stops.length) { lines.push('', 'Hard stops:'); r.stops.forEach(function (q) { lines.push('- ' + q.t[S.role || 'teacher']); }); }
    if (S.ask) lines.push('', 'Question for the company: ' + S.ask);
    lines.push('', 'Exercise result only. Not district approval or legal advice. Confirm with your technology office.');
    return lines.join('\n');
  }

  function compareHTML() {
    var ft = S.ft, pk = curPack();
    if (!pk || Object.keys(ft.ans).length < CHECK.length) return '';
    var role = S.role || 'teacher';
    var diffs = CHECK.filter(function (q) { return ft.ans[q.id] !== pk.q[q.id].key; });
    var m = CHECK.length - diffs.length;
    return '<div class="small"><span class="muted">COMPARED WITH OUR NOTES</span><br>You matched our reading on ' + m + ' of ' + CHECK.length + ' questions.' +
      (diffs.length ? '<details><summary>Where we read it differently (' + diffs.length + ')</summary><ul class="tight">' + diffs.map(function (q) {
        return '<li><b>' + esc(q.t[role]) + '</b> You chose ' + VLAB[ft.ans[q.id]][0] + '. We read it as ' + VLAB[pk.q[q.id].key][0] + '. ' + esc(pk.q[q.id].why) + '</li>';
      }).join('') + '</ul></details>' : '') + '</div>';
  }

  function vCard() {
    var r = risk(), V = VERDICT[r.v], role = S.role || 'teacher', anim = S.anim === 'card', cid = cardId();
    var h = '<section class="panel stack"><div><h2>Clearance Card</h2><p class="prompt">Your whole snapshot in one place: how you did on the practice and on a real tool. Share it with your tech director or teacher, or keep it. Tip: take a screenshot to save it.</p></div>' +

    } else {
      var missing = CHECK.filter(function (q) { return S.chk[q.id] === undefined; });
      h += '<p class="small muted">' + missing.length + ' question(s) still blank: ' + missing.map(function (q) { return esc(q.t[role].split(' ').slice(0, 7).join(' ')) + '...'; }).join(' &middot; ') + '</p><div class="row"><button class="btn solid" data-act="go" data-step="pill">Go answer them</button></div>';
    }
    h += '</div></div>';
    if (r.v !== 'incomplete') h += '<div class="row"><button class="btn solid" data-act="copycard">Copy card text</button><button class="btn" data-act="go" data-step="pill">Edit answers</button><button class="btn" data-act="reset">Check another tool</button></div>';
    h += '<p class="small muted"><b>This card is a classroom exercise result. It is not district approval or legal advice.</b> Before real student data goes into any tool, your district\'s technology office must approve it.</p><p class="small muted">Local rules matter. Chester County has no county-level student privacy law of its own, so your district\'s board policies and technology office are the local authority. Pennsylvania adds breach-notification duties for personal information.</p></section>';
    h += badgesHTML();

      '<li>When is it fine to use a tool that scores Ask First, and with what content?</li></ul></section>';
    h += feedbackPanel();
    return h;
  }

  function summaryText() {
    var r = risk(), p = prod(), V = VERDICT[r.v], f = S.fb;
    var lines = ['THREAT SCANNER PILOT SUMMARY', 'Role: ' + roleLabel(), 'Scenario: ' + p.name + ' + ' + p.policyName + ' (level ' + S.tier + ', ' + TIERNAME[S.tier - 1] + ')'];
    if (S.history.length) lines.push('Scenario results: ' + S.history.map(function (h) { return h.name + ' ' + TIERNAME[h.tier - 1] + ' ' + h.band + ' (scan ' + Math.round(h.a * 100) + '%, missing ' + Math.round(h.b * 100) + '%)'; }).join('; '));

      LAWS.map(function (l) { return '<tr><td style="white-space:nowrap"><b>' + l[0] + '</b></td><td>' + l[1] + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<p class="small muted">Educational summary, not legal advice. Citations and any new Pennsylvania or district AI rules should be confirmed with your district solicitor or technology director before you share this widely.</p></div>' +
      '<details><summary>How the Clearance Card is built</summary><p>The card has three parts. Part A and Part B each show a rank from the learner\'s best scenario: Recruit (under 40%), Analyst (40 to 64%), Specialist (65 to 84%) or Elite (85% and up). The Field test section carries the verdict about the real tool, and it is scored as follows. Each of nine questions scores 0 (yes), 1 (unclear) or 2 (no or not found). Each lens can total 0 to 6. Any "No" or "Unclear" on a hard-stop question forces BLOCKED, because those questions cover training use, age and consent, and a findable policy. Otherwise 0 to 4 total is CLEARED, 5 to 9 is ASK FIRST, and 10 or more is BLOCKED. Even CLEARED never means real student data without district approval.</p></details>' +
      '<details><summary>Pick a specific scenario (for demos)</summary><div class="stack"><div class="small muted">Teacher path</div><div class="row">' + PRODUCTS.teacher.map(function (pr, k) { return '<button class="chipbtn" data-act="setpick" data-role="teacher" data-i="' + k + '">' + esc(pr.name) + ' + ' + esc(pr.policyName) + ' (' + TIERNAME[pr.tier - 1] + ')</button>'; }).join('') + '</div><div class="small muted">Student path</div><div class="row">' + PRODUCTS.student.map(function (pr, k) { return '<button class="chipbtn" data-act="setpick" data-role="student" data-i="' + k + '">' + esc(pr.name) + ' + ' + esc(pr.policyName) + ' (' + TIERNAME[pr.tier - 1] + ')</button>'; }).join('') + '</div></div></details>' +
      '<details><summary>Ideas to extend it</summary><ul class="tight"><li>Have teams argue one tool\'s verdict in front of a mock district board.</li><li>Rerun the check after the company updates its policy and compare the cards.</li><li>Students write a one-paragraph recommendation to their tech director.</li></ul></details>' +
      '</section>';
  }

  function render() {
    renderNav();
    var h = S.step === 'boot' ? vBoot() : S.step === 'decode' ? vScan() : S.step === 'pill' ? vPill() : S.step === 'card' ? vCard() : S.step === 'results' ? vResults() : vGuide();
    if (S.step !== lastStep) { $main.classList.remove('swap'); void $main.offsetWidth; $main.classList.add('swap'); lastStep = S.step; }
    $main.innerHTML = h;
    S.fresh = null; S.anim = null;
    animateGauges();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
    if (act === 'go') { S.step = b.getAttribute('data-step'); if (S.step === 'card') S.anim = 'card'; render(); window.scrollTo(0, 0); return; }
    if (act === 'role') { var rl = b.getAttribute('data-role'); if (S.role !== rl) { S.role = rl; S.order = null; S.history = []; } if (!S.order) pickSet(rl, 1); if (!S.t0) S.t0 = Date.now(); render(); return; }
    if (act === 'newset' || act === 'harder' || act === 'easier') { var tg = act === 'harder' ? Math.min(3, S.tier + 1) : act === 'easier' ? Math.max(1, S.tier - 1) : S.tier; pickSet(S.role || 'teacher', tg); render(); window.scrollTo(0, 0); return; }
    if (act === 'setpick') { var rl2 = b.getAttribute('data-role'); S.role = rl2; pickSet(rl2, undefined, i); S.step = 'decode'; render(); window.scrollTo(0, 0); return; }
    if (act === 'phase') { S.phase = b.getAttribute('data-p'); if (S.phase === 'R') logIfDone(); render(); window.scrollTo(0, 0); return; }
    if (act === 'packpick') {
      var pkx = PACKS.filter(function (p2) { return p2.id === b.getAttribute('data-id'); })[0]; if (!pkx) return;
      S.ft = { pack: pkx.id, i: 0, ans: {} }; S.chk = {}; S.auto = {}; S.tool = pkx.name + ': ' + pkx.acct; render(); window.scrollTo(0, 0); return;
    }
    if (act === 'packreset') { S.ft = { pack: null, i: 0, ans: {} }; S.chk = {}; S.auto = {}; S.tool = ''; render(); window.scrollTo(0, 0); return; }
    if (act === 'ftans') { var qq = CHECK[S.ft.i]; if (!qq || S.ft.ans[qq.id] !== undefined) return; var vv = +b.getAttribute('data-v'); S.ft.ans[qq.id] = vv; S.chk[qq.id] = vv; render(); return; }
    if (act === 'ftnext') { S.ft.i = Math.min(CHECK.length, S.ft.i + 1); render(); setTimeout(function () { var el = document.getElementById('ftq'); if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0); }, 30); return; }
    if (act === 'fbclear') { S.fb.clear = +b.getAttribute('data-n'); render(); return; }
    if (act === 'fblen') { S.fb.len = b.getAttribute('data-n'); render(); return; }
    if (act === 'pill') {
      var v = b.getAttribute('data-v');
      S.c[i] = v === 'safe' ? { v: 'safe', locked: true } : { v: 'flag', lens: null, locked: false };
      if (v === 'safe') S.fresh = i;
      render(); return;
    }
    if (act === 'lens') { S.c[i].lens = b.getAttribute('data-l'); S.c[i].locked = true; S.fresh = i; render(); return; }
    if (act === 'sil') { S.sil[i] = b.getAttribute('data-v'); logIfDone(); render(); return; }
    if (act === 'chk') { S.chk[b.getAttribute('data-id')] = +b.getAttribute('data-v'); delete S.auto[b.getAttribute('data-id')]; render(); return; }
    if (act === 'azrun') {
      var atx = (S.az.text || '').trim();
      if (atx.length < 200) { S.az.err = 'Paste more of the policy first. At least a few paragraphs are needed.'; S.az.res = null; }
      else { S.az.err = ''; S.az.res = analyzePolicy(atx.slice(0, 250000)); S.az.ovr = {}; }
      render();
      setTimeout(function () { var el = document.getElementById('azresult'); if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); }, 60);
      return;
    }
    if (act === 'azsample') { S.az.text = SAMPLE_POLICY; S.az.err = ''; render(); return; }
    if (act === 'azclear') { S.az = { text: '', res: null, ovr: {}, err: '' }; render(); return; }
    if (act === 'azset') { S.az.ovr[b.getAttribute('data-id')] = +b.getAttribute('data-v'); render(); return; }
    if (act === 'azload') {
      if (!S.az.res) return;
      CHECK.forEach(function (c) { var r = S.az.res.q[c.id]; if (!r) return; S.chk[c.id] = S.az.ovr[c.id] !== undefined ? S.az.ovr[c.id] : r.val; S.auto[c.id] = 'Analyzer: ' + r.why; });
      S.usedAz = true; S.mode = 'manual'; render(); window.scrollTo(0, 0); return;
    }
    if (act === 'mode') { S.mode = b.getAttribute('data-mode'); render(); return; }
    if (act === 'ver') { S.ver = i; render(); return; }
    if (act === 'autoload') {
      var pr = matchProfile(S.tool); if (!pr) return;
      var vr = pr.versions[Math.min(S.ver, pr.versions.length - 1)];
      CHECK.forEach(function (q) { var en = vr.a[q.id], val = autoVal(en); if (val !== undefined) { S.chk[q.id] = val; S.auto[q.id] = en[1]; } });
      S.tool = pr.name + ': ' + vr.label; S.mode = 'manual'; render(); window.scrollTo(0, 0); return;
    }
    if (act === 'pick') { S.tool = b.getAttribute('data-name'); S.ver = 0; render(); return; }
    if (act === 'copycard') { copy(cardText()); return; }
    if (act === 'submit') {
      if (!DB || !UID) return;
      S.sub = 'saving'; render();
      DB.doc('responses/' + UID).set(payload()).then(function () { S.sub = 'saved'; render(); }, function (e) { S.sub = (e && e.code) || 'error'; render(); });
      return;
    }
    if (act === 'loadres') { loadResults(); return; }
    if (act === 'copyfb') { copy(summaryText()); return; }
    if (act === 'reset') { S.chk = {}; S.auto = {}; S.tool = ''; S.ask = ''; S.ft = { pack: null, i: 0, ans: {} }; S.step = 'pill'; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'tool') { S.tool = e.target.value; S.ver = 0; var f = document.getElementById('finder') || document.getElementById('autobox'); if (f) f.innerHTML = S.mode === 'auto' ? autoHTML() : finderHTML(S.tool); }
    else if (id === 'aztext') S.az.text = e.target.value;
    else if (id === 'dist') S.dist = e.target.value;
    else if (id === 'pol') S.pol = e.target.value;
    else if (id === 'ask') S.ask = e.target.value;
    else if (id === 'say') S.fb.say = e.target.value;
  });

  render();

  /* ---------- boot sequence ---------- */
  (function () {
    var el = document.getElementById('boot'), log = document.getElementById('bootlog');
    if (!el || !log) return;
    if (reduced) { el.parentNode.removeChild(el); return; }
    var lines = ['INITIALIZING THREAT SCANNER', 'LOADING RULESETS: FERPA, COPPA, CIPA, PA LAW', 'CALIBRATING LENSES: DATA, RULES, SIGHT', 'SCANNER ONLINE'];
    var i = 0, over = false;
    function finish() { if (over) return; over = true; el.classList.add('out'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 650); }
    function next() {
      if (over) return;
      if (i >= lines.length) { setTimeout(finish, 450); return; }
      var d = document.createElement('div'); i++;
      d.innerHTML = '<span class="t">&gt; ' + lines[i - 1] + '</span> <span class="ok">' + (i < lines.length ? '[ OK ]' : '') + '</span>';
      log.appendChild(d); setTimeout(next, 520);
    }
    next(); el.addEventListener('click', finish); document.addEventListener('keydown', finish, { once: true });
  })();

  /* ---------- optional shared storage for pilot responses ---------- */
  if (window.claude && window.claude.use) {
    window.claude.use('db').then(function (d) { DB = d; if (S.step === 'card') render(); }, function () {});
    window.claude.use('user').then(function (u) {
      if (!u) return;
      Promise.all([u.id(), u.canEdit()]).then(function (v) { UID = v[0]; IS_ADMIN = !!v[1]; render(); });
    }, function () {});
  }
})();
</script>
